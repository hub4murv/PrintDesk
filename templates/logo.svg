<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" fill="#FFFFFF" />
  <g transform="translate(250, 250)">
    <!-- CMYK Overlapping Translucent Circles -->
    <g style="mix-blend-mode: multiply;" opacity="0.85">
      <!-- Cyan -->
      <circle cx="-25" cy="-30" r="70" fill="#0BB4D6" />
      <!-- Magenta -->
      <circle cx="35" cy="-10" r="70" fill="#E4067E" />
      <!-- Yellow -->
      <circle cx="-15" cy="40" r="70" fill="#FFC400" />
    </g>

    <!-- Outer Double Target Registration Ring -->
    <g stroke="#15171A" fill="none" stroke-linecap="square">
      <circle cx="0" cy="0" r="140" stroke-width="6" />
      <circle cx="0" cy="0" r="120" stroke-width="4" />

      <!-- Main Axis Crosshairs -->
      <line x1="-180" y1="0" x2="180" y2="0" stroke-width="6" />
      <line x1="0" y1="-180" x2="0" y2="180" stroke-width="6" />

      <!-- Diagonal Tick Marks -->
      <line x1="-110" y1="-110" x2="-80" y2="-80" stroke-width="5" />
      <line x1="110" y1="-110" x2="80" y2="-80" stroke-width="5" />
      <line x1="-110" y1="110" x2="-80" y2="80" stroke-width="5" />
      <line x1="110" y1="110" x2="80" y2="80" stroke-width="5" />

      <!-- Outer Arrows -->
      <polygon points="0,-185 -10,-165 10,-165" fill="#15171A" />
      <polygon points="0,185 -10,165 10,165" fill="#15171A" />
      <polygon points="-185,0 -165,-10 -165,10" fill="#15171A" />
      <polygon points="185,0 165,-10 165,10" fill="#15171A" />
    </g>

    <!-- Center Target Crosshair -->
    <g stroke="#15171A" stroke-width="5" fill="none">
      <circle cx="0" cy="0" r="40" />
      <line x1="-55" y1="0" x2="55" y2="0" />
      <line x1="0" y1="-55" x2="0" y2="55" />
    </g>
  </g>
</svg>